name: docker-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build service images
        run: docker compose build core_trading data_pipeline bot_runner simulator_ui

      - name: Lint Go
        run: make lint-go

      - name: Lint Python
        run: make lint-py

      - name: Lint Bot Runner
        run: make lint-bot-runner

      - name: Test Go
        run: make test-go

      - name: Test Python
        run: make test-py

      - name: Test Bot Runner
        run: make test-bot-runner

      - name: Typecheck UI
        run: make typecheck-ui

      - name: Lint UI
        run: make lint-ui

      - name: Test UI
        run: make test-ui

      - name: Build UI
        run: make build-ui

      - name: Mocked browser UI acceptance
        run: make test-e2e-ui

      - name: Smoke paper trading flow
        run: make smoke-paper

      - name: Smoke Kafka bridge flow
        run: make smoke-paper-kafka

      - name: Smoke session restore flow
        run: make smoke-restore

      - name: Smoke simulation run flow
        run: make smoke-sim-run

      - name: Smoke simulation experiment flow
        run: make smoke-sim-experiment

      - name: Smoke UI runtime proxy flow
        run: make smoke-ui-runtime

      - name: Smoke UI dev proxy flow
        run: make smoke-ui-dev

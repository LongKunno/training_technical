name: k8s-ci

on:
  push:
  pull_request:

env:
  KIND_VERSION: v0.24.0
  KUBECTL_VERSION: v1.31.2

jobs:
  helm-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Helm lint
        run: make k8s-lint

      - name: Helm template default
        run: make k8s-template

      - name: Helm template HA profile
        run: make k8s-template K8S_VALUES_EXTRA='./k8s/helm/crypto-simulator/values-ha.yaml'

      - name: Helm template NodePort profile
        run: make k8s-template K8S_VALUES_EXTRA='./k8s/helm/crypto-simulator/values-exposure-nodeport.yaml'

      - name: Helm template LoadBalancer profile
        run: make k8s-template K8S_VALUES_EXTRA='./k8s/helm/crypto-simulator/values-exposure-lb.yaml'

      - name: Helm template static PV profile
        run: make k8s-template K8S_VALUES_EXTRA='./k8s/helm/crypto-simulator/values-static-pv-demo.yaml'

  kind-smoke:
    runs-on: ubuntu-latest
    needs: helm-verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install kind
        run: |
          curl -fsSL -o ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        run: |
          curl -fsSL -o ./kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Create kind cluster and bootstrap addons
        run: make k8s-kind-up

      - name: Build service images
        run: make k8s-build-images

      - name: Load images into kind
        run: make k8s-load-images

      - name: Deploy Helm release
        run: make k8s-deploy

      - name: K8s smoke
        run: make k8s-smoke

      - name: K8s restore smoke
        run: make k8s-smoke-restore

      - name: Dump K8s status on failure
        if: failure()
        run: |
          make k8s-status || true
          kubectl get events -A --sort-by=.lastTimestamp || true

      - name: Tear down kind cluster
        if: always()
        run: make k8s-kind-down

services:
  simulator_ui:
    build:
      context: ./services/simulator-ui
      dockerfile: Dockerfile
      target: dev
    command:
      [
        "sh",
        "-lc",
        "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi && npm run dev -- --host 0.0.0.0 --port 80 --strictPort",
      ]
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=80
      - SIMULATOR_UI_CORE_PROXY_TARGET=http://core_trading:8080
      - SIMULATOR_UI_DATA_PROXY_TARGET=http://data_pipeline:8000
    volumes:
      - ./services/simulator-ui:/app
      - simulator_ui_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  simulator_ui_node_modules:

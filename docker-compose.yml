version: '3.8'

services:
  # === INFRASTRUCTURE ===
  postgres:
    image: postgres:15-alpine
    container_name: crypto_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: crypto_sim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    ports:
      - "6379:6379"

  # === MICROSERVICES ===
  core_trading:
    build: 
      context: ./services/core-trading-go
      dockerfile: Dockerfile.dev
    container_name: core_trading_go
    ports:
      - "8080:8080"
    volumes:
      # Mount code cho hot-reload
      - ./services/core-trading-go:/app 
    environment:
      - DB_URI=postgres://root:rootpassword@postgres:5432/crypto_sim
      - REDIS_URL=redis:6379
    depends_on:
      - postgres
      - redis

  data_pipeline:
    build: 
      context: ./services/data-pipeline-py
      dockerfile: Dockerfile.dev
    container_name: data_pipeline_py
    ports:
      - "8000:8000"
    volumes:
      # Mount code cho hot-reload
      - ./services/data-pipeline-py:/app
    environment:
      - DB_URI=postgresql://root:rootpassword@postgres:5432/crypto_sim
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:

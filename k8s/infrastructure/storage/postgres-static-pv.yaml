apiVersion: v1
kind: PersistentVolume
metadata:
  name: crypto-simulator-postgres-static
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/local-path/crypto-simulator/postgres
    type: DirectoryOrCreate

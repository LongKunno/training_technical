apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crypto-simulator.secretName" . }}
  labels:
    {{- include "crypto-simulator.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  DB_URI: {{ include "crypto-simulator.databaseURI" . | quote }}
  DATABASE_URL: {{ include "crypto-simulator.databaseURI" . | quote }}
  PY_DATA_PIPELINE_DB_URI: {{ include "crypto-simulator.pythonDatabaseURI" . | quote }}
  OPS_BENCHMARK_TOKEN: {{ .Values.opsBenchmark.token | quote }}

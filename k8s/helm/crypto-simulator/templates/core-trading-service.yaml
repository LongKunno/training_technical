apiVersion: v1
kind: Service
metadata:
  name: {{ include "crypto-simulator.coreTradingServiceName" . }}
  labels:
    {{- include "crypto-simulator.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-trading
spec:
  selector:
    {{- include "crypto-simulator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: core-trading
  ports:
    - name: http
      port: {{ .Values.coreTrading.service.port }}
      targetPort: http

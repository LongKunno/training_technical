  selector:
    matchLabels:
      {{- include "crypto-simulator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: data-pipeline
{{- end }}
{{- if .Values.podDisruptionBudget.simulatorUi.enabled }}
---
apiVersion: policy/v1

{{- if .Values.podDisruptionBudget.coreTrading.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "crypto-simulator.coreTradingServiceName" . }}
  labels:
    {{- include "crypto-simulator.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-trading
spec:
  minAvailable: {{ .Values.podDisruptionBudget.coreTrading.minAvailable }}
  selector:
    matchLabels:
      {{- include "crypto-simulator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core-trading
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "crypto-simulator.simulatorUiServiceName" . }}
  labels:
    {{- include "crypto-simulator.labels" . | nindent 4 }}
    app.kubernetes.io/component: simulator-ui
  {{- if and (eq .Values.exposure.mode "loadBalancer") .Values.exposure.loadBalancer.annotations }}
  annotations:
    {{- toYaml .Values.exposure.loadBalancer.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ include "crypto-simulator.simulatorUiServiceType" . }}
  selector:
    {{- include "crypto-simulator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: simulator-ui
  ports:
    - name: http
      port: {{ .Values.simulatorUi.service.port }}
      targetPort: http
      {{- if eq .Values.exposure.mode "nodePort" }}
      nodePort: {{ .Values.exposure.nodePort.port }}
      {{- end }}
  {{- if and (eq .Values.exposure.mode "loadBalancer") .Values.exposure.loadBalancer.ip }}
  loadBalancerIP: {{ .Values.exposure.loadBalancer.ip | quote }}
  {{- end }}
